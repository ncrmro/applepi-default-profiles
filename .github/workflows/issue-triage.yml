# Triage every newly opened issue: the agent classifies it as fix/feature/idea,
# applies that one label, and leaves a comment (or asks a team member to look
# when unclear). Runs on GitHub Models (openai/gpt-5-mini) with zero API
# keys — `models: read` is all the inference auth needed.
#
# Model choice is rate-limit-bound, not quality-bound: full gpt-5 sits in
# GitHub Models' most restricted tier and 429'd mid-run every time we tried
# it (even a single serial run — an agentic loop burns several requests in
# seconds). gpt-5-mini's looser tier survives the loop. If you change the
# model, re-validate a full run, not just the first response.
name: Issue triage
on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write
  models: read

jobs:
  triage:
    # Never triage issues the automation itself opened.
    if: github.event.issue.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure GitHub Models provider for pi
        run: |
          mkdir -p "$HOME/.pi/agent"
          cp .github/models.json "$HOME/.pi/agent/models.json"
      # Track main while validating; switch to @v1 once the tag exists.
      - uses: ai-outfitter/actions@main
        with:
          profile: issue-triage
          # Absolute path: outfitter resolves relative path sources against /,
          # not the workspace (see ai-outfitter/actions path handling).
          profile-source: ${{ github.workspace }}/profiles
          # Pass the issue by number only; the profile fetches content with
          # `gh` so untrusted issue text never enters workflow code.
          prompt: >-
            Triage issue #${{ github.event.issue.number }} in
            ${{ github.repository }} following your process.
      # A green agent run is not proof of work — validate the side effects:
      # exactly one triage label (or the unclear-issue path) and a comment.
      # Pinned to the commit that adds the script; move to @main / @v1 once
      # ai-outfitter/actions#3 merges.
      - name: Validate triage side effects
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -o /tmp/validate-triage.sh \
            https://raw.githubusercontent.com/ai-outfitter/actions/8626a9465170fd14c0f87f52a9147f9f2545ce46/scripts/validate-triage.sh
          chmod +x /tmp/validate-triage.sh
          /tmp/validate-triage.sh \
            --repo "${{ github.repository }}" \
            --issue "${{ github.event.issue.number }}" \
            --allow-unlabeled
