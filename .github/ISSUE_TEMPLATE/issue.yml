name: Issue
description: Report a bug, request a change, or float an idea — the triage agent classifies it as fix/feature/idea.
body:
  - type: markdown
    attributes:
      value: >-
        No need to categorize — a triage agent reads every new issue, labels
        it `fix`, `feature`, or `idea`, and comments. A couple of sentences
        is enough.
  - type: textarea
    id: what
    attributes:
      label: What's up
      description: The bug, the change you want, or the idea.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Repro steps, links, prior art — whatever helps. Optional.
    validations:
      required: false
